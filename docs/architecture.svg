<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" font-family="'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif">
  <title>Azure Hub and Spoke with Bicep - architecture</title>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B2A4A" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3CCBF4"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#F2A900"/>
    </linearGradient>
    <linearGradient id="fw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F25022"/>
      <stop offset="1" stop-color="#C4314B"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD3B3"/>
      <stop offset="1" stop-color="#008575"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4314B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#008575"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#0078D4"/>
    </marker>

    <!-- Icons -->
    <g id="i-vnet">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#azure)"/>
      <path d="M9 8 L4 14 L9 20 M19 8 L24 14 L19 20" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10.5" cy="14" r="1.6" fill="#FFFFFF"/>
      <circle cx="14" cy="14" r="1.6" fill="#FFFFFF"/>
      <circle cx="17.5" cy="14" r="1.6" fill="#FFFFFF"/>
    </g>
    <g id="i-firewall">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#fw)"/>
      <path d="M5 9 H23 M5 14 H23 M5 19 H23 M11 9 V14 M18 9 V14 M8 14 V19 M15 14 V19 M21 14 V19 M11 19 V23 M18 19 V23" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    </g>
    <g id="i-bastion">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#azure)"/>
      <path d="M6 8 L12 14 L6 20 M22 8 L16 14 L22 20" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="i-gateway">
      <path d="M14 1 L27 14 L14 27 L1 14 Z" fill="url(#gw)"/>
      <path d="M14 7 V21 M7 14 H21" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M11 10 L14 7 L17 10 M11 18 L14 21 L17 18 M10 11 L7 14 L10 17 M18 11 L21 14 L18 17" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="i-dns">
      <circle cx="14" cy="14" r="13" fill="url(#azure)"/>
      <text x="14" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">DNS</text>
    </g>
    <g id="i-keyvault">
      <circle cx="14" cy="14" r="13" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
      <circle cx="14" cy="10" r="5" fill="url(#key)"/>
      <circle cx="14" cy="10" r="1.8" fill="#FFFFFF"/>
      <path d="M12.5 14 H15.5 V22 H14 L12.5 20.5 Z" fill="url(#key)"/>
    </g>
    <g id="i-endpoint">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.2"/>
      <path d="M8 7 L4 12 L8 17 M16 7 L20 12 L16 17" fill="none" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="2.4" fill="#6BB700"/>
    </g>
    <g id="i-building">
      <rect x="4" y="2" width="20" height="25" rx="2" fill="#605E5C"/>
      <g fill="#FFFFFF">
        <rect x="8" y="6" width="4" height="3"/><rect x="16" y="6" width="4" height="3"/>
        <rect x="8" y="12" width="4" height="3"/><rect x="16" y="12" width="4" height="3"/>
        <rect x="12" y="20" width="4" height="7"/>
      </g>
    </g>
    <g id="i-cloud">
      <path d="M8 22 C3 22 1 18.5 1.5 15.5 C2 12.5 5 11 7.5 11.5 C8.5 7 12.5 5 16.5 6 C20 7 21.5 10 21.5 12 C25 12 27.5 14.5 27 17.5 C26.5 20.5 24 22 21.5 22 Z" fill="url(#azure)"/>
    </g>
    <g id="i-nsg">
      <path d="M7 1 L13 3.5 V8 C13 11.5 10.5 13.5 7 14.5 C3.5 13.5 1 11.5 1 8 V3.5 Z" fill="#0078D4"/>
    </g>
    <g id="i-route">
      <circle cx="7" cy="7.5" r="6.5" fill="#C4314B"/>
      <path d="M4 7.5 H10 M7.5 5 L10 7.5 L7.5 10" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="960" height="770" rx="16" fill="#EAF0F6" stroke="#C8D6E5"/>

  <!-- External -->
  <g filter="url(#shadow)">
    <rect x="44" y="22" width="220" height="62" rx="10" fill="#F3F2F1" stroke="#D2D0CE"/>
    <rect x="696" y="22" width="220" height="62" rx="10" fill="#FFFFFF" stroke="#C7E0F4"/>
  </g>
  <use href="#i-building" x="60" y="38"/>
  <text x="98" y="49" font-size="14" font-weight="600" fill="#243A5E">On-premises</text>
  <text x="98" y="68" font-size="11.5" fill="#605E5C">Datacenter network</text>
  <use href="#i-cloud" x="712" y="38"/>
  <text x="750" y="49" font-size="14" font-weight="600" fill="#243A5E">Internet</text>
  <text x="750" y="68" font-size="11.5" fill="#605E5C">Users and partners</text>

  <!-- Hub resource group -->
  <rect x="24" y="108" width="912" height="236" rx="14" fill="#D6E8F8" stroke="#0078D4" stroke-width="1.6"/>
  <use href="#i-vnet" x="270" y="122"/>
  <text x="308" y="141" font-size="16" font-weight="700" fill="#243A5E">Hub VNet</text>
  <text x="390" y="141" font-size="12.5" fill="#605E5C">10.0.0.0/22</text>
  <text x="916" y="141" font-size="12" font-weight="600" fill="#0078D4" text-anchor="end">rg-hs-hub-dev</text>

  <g filter="url(#shadow)">
    <rect x="44" y="166" width="200" height="158" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
    <rect x="258" y="166" width="230" height="158" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
    <rect x="502" y="166" width="200" height="158" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
    <rect x="716" y="166" width="200" height="158" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
  </g>

  <!-- VPN gateway -->
  <use href="#i-gateway" x="60" y="182"/>
  <text x="98" y="195" font-size="13.5" font-weight="700" fill="#243A5E">VPN gateway</text>
  <text x="98" y="212" font-size="11.5" fill="#605E5C">VpnGw1AZ, route-based</text>
  <rect x="60" y="226" width="168" height="26" rx="6" fill="#F3F2F1"/>
  <text x="70" y="243" font-size="11.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">GatewaySubnet</text>
  <text x="60" y="272" font-size="11.5" fill="#605E5C">10.0.0.0/26</text>
  <rect x="60" y="286" width="72" height="22" rx="11" fill="#FFF4CE"/>
  <text x="96" y="301" font-size="11" font-weight="600" fill="#8A6100" text-anchor="middle">optional</text>

  <!-- Firewall -->
  <use href="#i-firewall" x="274" y="182"/>
  <text x="312" y="195" font-size="13.5" font-weight="700" fill="#243A5E">Azure Firewall</text>
  <text x="312" y="212" font-size="11.5" fill="#605E5C">Policy, egress rules, logs</text>
  <rect x="274" y="226" width="198" height="26" rx="6" fill="#F3F2F1"/>
  <text x="284" y="243" font-size="11.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">AzureFirewallSubnet</text>
  <text x="274" y="272" font-size="11.5" fill="#605E5C">10.0.0.64/26 + management /26</text>
  <rect x="274" y="286" width="72" height="22" rx="11" fill="#FFF4CE"/>
  <text x="310" y="301" font-size="11" font-weight="600" fill="#8A6100" text-anchor="middle">optional</text>

  <!-- Bastion -->
  <use href="#i-bastion" x="518" y="182"/>
  <text x="556" y="195" font-size="13.5" font-weight="700" fill="#243A5E">Azure Bastion</text>
  <text x="556" y="212" font-size="11.5" fill="#605E5C">Admin access, no VM IPs</text>
  <rect x="518" y="226" width="168" height="26" rx="6" fill="#F3F2F1"/>
  <text x="528" y="243" font-size="11.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">AzureBastionSubnet</text>
  <text x="518" y="272" font-size="11.5" fill="#605E5C">10.0.0.192/26</text>
  <rect x="518" y="286" width="72" height="22" rx="11" fill="#FFF4CE"/>
  <text x="554" y="301" font-size="11" font-weight="600" fill="#8A6100" text-anchor="middle">optional</text>

  <!-- Private DNS -->
  <use href="#i-dns" x="732" y="182"/>
  <text x="770" y="195" font-size="13.5" font-weight="700" fill="#243A5E">Private DNS zone</text>
  <text x="770" y="212" font-size="11.5" fill="#605E5C">Linked to hub and spoke</text>
  <rect x="732" y="226" width="168" height="26" rx="6" fill="#F3F2F1"/>
  <text x="740" y="243" font-size="10.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">privatelink.vaultcore</text>
  <text x="732" y="272" font-size="11.5" fill="#605E5C">Central name resolution</text>
  <rect x="732" y="286" width="72" height="22" rx="11" fill="#DFF6DD"/>
  <text x="768" y="301" font-size="11" font-weight="600" fill="#107C10" text-anchor="middle">always</text>

  <!-- On-premises to gateway -->
  <path d="M144 84 V162" stroke="#008575" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <text x="152" y="128" font-size="11" font-weight="600" fill="#008575">Site-to-site VPN</text>

  <!-- Peering -->
  <path d="M610 348 V394" stroke="#0078D4" stroke-width="2.5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <rect x="626" y="356" width="290" height="30" rx="15" fill="#0078D4"/>
  <text x="771" y="376" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">VNet peering, gateway transit</text>

  <!-- Spoke resource group -->
  <rect x="24" y="398" width="912" height="350" rx="14" fill="#D6E8F8" stroke="#0078D4" stroke-width="1.6"/>
  <use href="#i-vnet" x="44" y="412"/>
  <text x="82" y="431" font-size="16" font-weight="700" fill="#243A5E">Spoke VNet</text>
  <text x="178" y="431" font-size="12.5" fill="#605E5C">10.1.0.0/22</text>
  <text x="916" y="431" font-size="12" font-weight="600" fill="#0078D4" text-anchor="end">rg-hs-spoke-dev</text>

  <g filter="url(#shadow)">
    <rect x="44" y="456" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
    <rect x="258" y="456" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
    <rect x="472" y="456" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
    <rect x="686" y="456" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
  </g>

  <!-- Subnet: private link -->
  <text x="60" y="482" font-size="12" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">snet-privatelink</text>
  <text x="60" y="500" font-size="11.5" fill="#605E5C">10.1.3.0/24</text>
  <use href="#i-endpoint" x="60" y="514"/>
  <text x="92" y="531" font-size="12.5" font-weight="600" fill="#243A5E">Private endpoint</text>
  <use href="#i-nsg" x="60" y="572"/>
  <text x="80" y="583" font-size="11" fill="#605E5C">NSG</text>

  <!-- Subnet: backend -->
  <text x="274" y="482" font-size="12" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">snet-backend</text>
  <text x="274" y="500" font-size="11.5" fill="#605E5C">10.1.2.0/24</text>
  <text x="274" y="531" font-size="12.5" font-weight="600" fill="#243A5E">Backend tier</text>
  <text x="274" y="549" font-size="11" fill="#605E5C">443 and 1433 from frontend</text>
  <use href="#i-nsg" x="274" y="572"/>
  <text x="294" y="583" font-size="11" fill="#605E5C">NSG</text>
  <use href="#i-route" x="332" y="571"/>
  <text x="352" y="583" font-size="11" fill="#605E5C">UDR to firewall</text>

  <!-- Subnet: frontend -->
  <text x="488" y="482" font-size="12" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">snet-frontend</text>
  <text x="488" y="500" font-size="11.5" fill="#605E5C">10.1.1.0/24</text>
  <text x="488" y="531" font-size="12.5" font-weight="600" fill="#243A5E">Frontend tier</text>
  <text x="488" y="549" font-size="11" fill="#605E5C">443 from Application Gateway</text>
  <use href="#i-nsg" x="488" y="572"/>
  <text x="508" y="583" font-size="11" fill="#605E5C">NSG</text>
  <use href="#i-route" x="546" y="571"/>
  <text x="566" y="583" font-size="11" fill="#605E5C">UDR to firewall</text>

  <!-- Subnet: Application Gateway -->
  <text x="702" y="482" font-size="12" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#243A5E">snet-appgw</text>
  <text x="702" y="500" font-size="11.5" fill="#605E5C">10.1.0.0/24</text>
  <text x="702" y="531" font-size="12.5" font-weight="600" fill="#243A5E">Application Gateway</text>
  <text x="702" y="549" font-size="11" fill="#605E5C">WAF v2, reserved subnet</text>
  <use href="#i-nsg" x="702" y="572"/>
  <text x="722" y="583" font-size="11" fill="#605E5C">NSG</text>

  <!-- Traffic flow: Internet to appgw to frontend to backend -->
  <path d="M916 53 H946 V531 H890" stroke="#0078D4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="914" y="522" font-size="11" font-weight="600" fill="#0078D4" text-anchor="middle">443</text>
  <path d="M686 531 H676" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M472 531 H462" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Forced tunnelling -->
  <path d="M358 456 V328" stroke="#C4314B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <path d="M572 456 V420 H460 V328" stroke="#C4314B" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="366" y="358" width="136" height="24" rx="12" fill="#FDE7E9"/>
  <text x="434" y="374" font-size="11" font-weight="600" fill="#C4314B" text-anchor="middle">0.0.0.0/0 egress</text>

  <!-- Key Vault -->
  <path d="M144 606 V650" stroke="#6BB700" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="44" y="654" width="300" height="76" rx="10" fill="#FFFFFF" stroke="#B9CCE0"/>
  </g>
  <use href="#i-keyvault" x="60" y="678"/>
  <text x="98" y="681" font-size="13.5" font-weight="700" fill="#243A5E">Key Vault</text>
  <text x="98" y="699" font-size="11.5" fill="#605E5C">Public network access disabled</text>
  <text x="98" y="716" font-size="11.5" fill="#605E5C">RBAC, purge protection</text>

  <!-- Legend -->
  <g font-size="11.5" fill="#605E5C">
    <path d="M380 668 H410" stroke="#0078D4" stroke-width="2"/>
    <text x="418" y="672">Inbound application traffic</text>
    <path d="M380 692 H410" stroke="#C4314B" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="418" y="696">Forced egress through the firewall</text>
    <path d="M380 716 H410" stroke="#008575" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="418" y="720">Hybrid connectivity</text>
    <rect x="650" y="658" width="72" height="22" rx="11" fill="#FFF4CE"/>
    <text x="686" y="673" font-size="11" font-weight="600" fill="#8A6100" text-anchor="middle">optional</text>
    <text x="732" y="673">Feature flag, billed hourly</text>
    <text x="650" y="700">Every subnet: NSG, deny-all inbound,</text>
    <text x="650" y="717">no default outbound access</text>
  </g>
</svg>
